name: Bot intradia agresivo (Paper)

# Presupuesto: ~2.000 min/mes gratis en repos privados.
# Una sesión real de ~70 min al día + disparadores de respaldo que salen en < 1 min
# (GitHub a veces retrasa horas las tareas programadas). ~1.750 min/mes.
on:
  schedule:
    # GitHub está retrasando estas tareas ~4-5 h. Se programan adelantadas y
    # repartidas para que alguna llegue justo a la apertura (14:30 UTC en invierno).
    # Las que llegan antes de hora salen en segundos; si llega hasta 12 min antes, espera.
    - cron: "7 8 * * 1-5"
    - cron: "37 8 * * 1-5"
    - cron: "7 9 * * 1-5"
    - cron: "37 9 * * 1-5"
    - cron: "7 10 * * 1-5"
    - cron: "45 15 * * 1-5"   # último respaldo (sesión tardía si ninguna llegó a tiempo)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-trading
  cancel-in-progress: false

jobs:
  sesion:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "intradia.py"

      - name: Sesión de trading
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: uv run --python 3.12 intradia.py

      - name: Guardar registros
        if: always()
        run: |
          git config user.name "bot-trading"
          git config user.email "bot-trading@users.noreply.github.com"
          git add registros/
          git diff --cached --quiet && exit 0
          git commit -m "Sesión intradía $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
